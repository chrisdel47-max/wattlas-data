name: refresh traffic

# La source DATEX II (agrégation) se rafraîchit à l'heure : inutile de
# tourner plus souvent. :17 pour éviter la ruée du top-heure sur GitHub.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer traffic.geojson depuis le flux DATEX II
        # Sans argument : source = le flux DATEX II, sortie = traffic.geojson.
        # NE PAS passer "traffic.geojson" ici — ce serait pris pour la SOURCE.
        # Tolérant : si le flux a un hoquet (indispo, HTML, gzip cassé), on
        # n'échoue PAS le workflow (donc pas d'email d'échec) — le script ne
        # touche au fichier qu'en cas de succès, on garde la dernière bonne
        # version et l'heure suivante retentera.
        run: |
          python build_traffic_geojson.py || {
            echo "::warning::Flux DATEX indisponible — on garde la version précédente."
          }
      - name: Commit si le fichier a changé
        run: |
          git config user.name "wattrip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add traffic.geojson
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Rebase avant de pousser, et on réessaie.
            #
            # Le job récupère `main` puis met une à deux minutes à régénérer
            # le fichier. Toute poussée humaine pendant cette fenêtre fait
            # rejeter la sienne — arrivé le 2026-08-02 en publiant
            # vehicles.json : le trafic n'a pas été rafraîchi de l'heure, et
            # rien ne le disait côté appli.
            #
            # Le conflit est impossible en pratique : personne d'autre
            # n'écrit traffic.geojson, le rebase ne fait que rejouer ce
            # commit au-dessus du travail des autres.
            pousse=0
            for essai in 1 2 3; do
              if git pull --rebase --quiet && git push; then
                pousse=1
                break
              fi
              echo "::warning::Poussée rejetée (essai $essai) — nouvelle tentative."
              sleep 5
            done
            if [ "$pousse" -ne 1 ]; then
              echo "::error::Poussée impossible après 3 tentatives."
              exit 1
            fi
          fi
